name: Configure OrbitFS Store Azure runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/configure-store-runtime.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  APP_NAME: OrbitFS-Website
  RESOURCE_GROUP: New

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7E25F3D3E2EB414EB477CF498EDAC5B9 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C4E4016A7E5F45908DA285905B447B62 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3C0B624FFD0B46E9A6B41FB1DD90F8D5 }}

      - name: Configure Supabase service credentials
        env:
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY GitHub secret is not configured."
            exit 2
          fi
          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --settings \
              SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
              ORBITFS_SUPABASE_URL="https://adutmcvusqeqonpvfcps.supabase.co" \
              WEBSITES_PORT="8080" \
              PORT="8080" \
              HOSTNAME="0.0.0.0"
          az webapp restart --resource-group "$RESOURCE_GROUP" --name "$APP_NAME"

      - name: Verify Store and database access
        run: |
          set -euo pipefail
          HOST=$(az webapp show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --query defaultHostName -o tsv)
          BASE="https://${HOST}"
          for path in / /api/license/v1/health /api/setup/first-user; do
            code=$(curl -sS -o /tmp/orbitfs-response -w '%{http_code}' --retry 5 --retry-delay 5 --max-time 30 "${BASE}${path}")
            echo "${path}: HTTP ${code}"
            cat /tmp/orbitfs-response
            echo
            if [ "$path" = "/" ] && [ "$code" != "200" ]; then exit 1; fi
            if [ "$path" != "/" ] && [ "$code" = "500" ]; then exit 1; fi
          done
