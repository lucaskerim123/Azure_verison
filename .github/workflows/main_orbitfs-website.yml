name: Build and deploy OrbitFS Store to Azure

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/main_orbitfs-website.yml'
  workflow_dispatch:

env:
  APP_NAME: OrbitFS-Website
  RESOURCE_GROUP: New
  NODE_VERSION: '24.x'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Store
        run: npm run build

      - name: Package deployment artifact
        working-directory: .
        run: tar -czf node-app.tar.gz web

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbitfs-store-azure
          path: node-app.tar.gz
          retention-days: 3

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: orbitfs-store-azure

      - name: Extract deployment artifact
        run: tar -xzf node-app.tar.gz

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7E25F3D3E2EB414EB477CF498EDAC5B9 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C4E4016A7E5F45908DA285905B447B62 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3C0B624FFD0B46E9A6B41FB1DD90F8D5 }}

      - name: Verify Store App Service
        run: |
          set -e
          az webapp show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --query '{name:name,state:state,host:defaultHostName}' -o table

      - name: Configure Node App Service runtime
        run: |
          set -e
          az webapp config set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --linux-fx-version "NODE|24-lts" \
            --startup-file "npm start"
          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --settings \
              PORT="8080" \
              HOSTNAME="0.0.0.0" \
              WEBSITE_NODE_DEFAULT_VERSION="24-lts" \
              SCM_DO_BUILD_DURING_DEPLOYMENT="false" \
              WEBSITES_CONTAINER_START_TIME_LIMIT="1800" \
              NEXT_TELEMETRY_DISABLED="1"

      - name: Deploy Store
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: Production
          package: web

      - name: Restart Store
        run: az webapp restart --resource-group "$RESOURCE_GROUP" --name "$APP_NAME"
