name: Build and deploy OrbitFS Core to Azure

on:
  workflow_dispatch:
    inputs:
      panel_app:
        description: Azure Web App name for OrbitFS Panel/Base
        required: true
        default: OrbitFS-Panel-Azure
      engine_app:
        description: Azure Web App name for OrbitFS Engine
        required: true
        default: OrbitFS-Engine-Azure
      deploy_engine:
        description: Deploy Engine as well as Panel
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: '22.x'
  PANEL_APP: ${{ inputs.panel_app }}
  ENGINE_APP: ${{ inputs.engine_app }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Azure repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            orbitfs-azure/panel/package-lock.json
            orbitfs-azure/engine/package-lock.json

      - name: Build Panel
        working-directory: orbitfs-azure/panel
        run: |
          npm ci
          npm run build
          npm prune --omit=dev

      - name: Build Engine
        if: ${{ inputs.deploy_engine }}
        working-directory: orbitfs-azure/engine
        run: |
          npm ci
          npm run build
          npm prune --omit=dev

      - name: Upload Panel
        uses: actions/upload-artifact@v4
        with:
          name: orbitfs-panel-azure
          path: orbitfs-azure/panel
          include-hidden-files: true
          retention-days: 3

      - name: Upload Engine
        if: ${{ inputs.deploy_engine }}
        uses: actions/upload-artifact@v4
        with:
          name: orbitfs-engine-azure
          path: orbitfs-azure/engine
          include-hidden-files: true
          retention-days: 3

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Panel
        uses: actions/download-artifact@v4
        with:
          name: orbitfs-panel-azure
          path: deploy/panel

      - name: Download Engine
        if: ${{ inputs.deploy_engine }}
        uses: actions/download-artifact@v4
        with:
          name: orbitfs-engine-azure
          path: deploy/engine

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7E25F3D3E2EB414EB477CF498EDAC5B9 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C4E4016A7E5F45908DA285905B447B62 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3C0B624FFD0B46E9A6B41FB1DD90F8D5 }}

      - name: Find Azure resource groups
        id: azure-resources
        shell: bash
        run: |
          PANEL_RG=$(az webapp list --query "[?name=='${PANEL_APP}'].resourceGroup | [0]" -o tsv)
          ENGINE_RG=$(az webapp list --query "[?name=='${ENGINE_APP}'].resourceGroup | [0]" -o tsv)
          if [ -z "$PANEL_RG" ]; then
            echo "Could not find Azure Web App '$PANEL_APP'."
            exit 1
          fi
          if [ "${{ inputs.deploy_engine }}" = "true" ] && [ -z "$ENGINE_RG" ]; then
            echo "Could not find Azure Web App '$ENGINE_APP'."
            exit 1
          fi
          echo "panel_rg=$PANEL_RG" >> "$GITHUB_OUTPUT"
          echo "engine_rg=$ENGINE_RG" >> "$GITHUB_OUTPUT"

      - name: Configure Panel
        run: |
          az webapp config set --resource-group "${{ steps.azure-resources.outputs.panel_rg }}" --name "$PANEL_APP" --startup-file "npm start"
          az webapp config appsettings set --resource-group "${{ steps.azure-resources.outputs.panel_rg }}" --name "$PANEL_APP" --settings WEBSITE_NODE_DEFAULT_VERSION="22-lts" SCM_DO_BUILD_DURING_DEPLOYMENT="false" ORBITFS_PANEL_URL="https://$PANEL_APP.azurewebsites.net" ORBITFS_ENGINE_HOST_URL="https://$ENGINE_APP.azurewebsites.net"

      - name: Deploy Panel
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.PANEL_APP }}
          package: deploy/panel

      - name: Configure Engine
        if: ${{ inputs.deploy_engine }}
        run: |
          az webapp config set --resource-group "${{ steps.azure-resources.outputs.engine_rg }}" --name "$ENGINE_APP" --startup-file "npm start"
          az webapp config appsettings set --resource-group "${{ steps.azure-resources.outputs.engine_rg }}" --name "$ENGINE_APP" --settings WEBSITE_NODE_DEFAULT_VERSION="22-lts" SCM_DO_BUILD_DURING_DEPLOYMENT="false" ORBITFS_PANEL_URL="https://$PANEL_APP.azurewebsites.net" ORBITFS_ENGINE_HOST_URL="https://$ENGINE_APP.azurewebsites.net"

      - name: Deploy Engine
        if: ${{ inputs.deploy_engine }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.ENGINE_APP }}
          package: deploy/engine
